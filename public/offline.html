<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection - XpertVA</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
       background:#f8fafc;color:#0f172a;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .card{max-width:22rem;text-align:center}
  .mark{width:64px;height:64px;border-radius:14px;background:#0f172a;color:#fff;
        display:grid;place-items:center;font-size:30px;font-weight:700;margin:0 auto 1.25rem}
  h1{font-size:1.25rem;margin:0 0 .5rem}
  p{color:#64748b;line-height:1.55;margin:0 0 1.5rem}
  button{background:#2563eb;color:#fff;border:0;border-radius:.5rem;
         padding:.7rem 1.4rem;font-size:.95rem;font-weight:600;cursor:pointer}
  button:hover{background:#1d4ed8}
</style>
</head>
<body>
  <div class="card">
    <div class="mark">X</div>
    <h1>You are offline</h1>
    <p>This page needs a connection. Nothing has been lost, and it will load as soon as you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
